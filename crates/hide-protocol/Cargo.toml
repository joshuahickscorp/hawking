[package]
name = "hide-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The single schema authority for the HIDE Agent Server: semantic object model + protocol (Bible sec 14, sec 15). Model-free."
autotests = false

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
schemars = "0.8"
# Depended on by path so the compat bridge maps the current Wire-B transport
# (Intent/UiEvent) onto this authority WITHOUT refactoring hide-core.
hide-core = { path = "../hide-core" }

[features]
default = []

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "hide-sdk-codegen"
path = "src/bin/hide-sdk-codegen.rs"

# BEGIN HAWKING TEST TOPOLOGY — generated targets keep routine source checks
# compact while preserving every historical test file as an explicit, isolated
# target when selected with `cargo test --test <name>`.

[[test]]
name = "compile_all"
path = "tests/compile_all.rs"
test = false

[[test]]
name = "sdk_client"
path = "tests/sdk_client.rs"
test = false

[[test]]
name = "sdk_fixtures"
path = "tests/sdk_fixtures.rs"
test = false

[[test]]
name = "sdk_golden"
path = "tests/sdk_golden.rs"
test = false
