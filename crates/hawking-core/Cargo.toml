[package]
name = "hawking-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Apple Silicon LLM inference engine core"
autotests = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# TQ (Trellis-Quant): hawking's deterministic sub-4-bit weight-serving project,
# built on the absorbed strand-quant codec. Pulls in the `.tq` decode + activation-RHT
# CPU serving reference (src/tq.rs). OFF by default so the product build is byte-identical
# (no strand-quant dep, no metal 0.27). Enable with:
#   cargo test -p hawking-core --features tq
tq = ["dep:strand-quant"]
# Compatibility shim for legacy objc macros re-exported by metal 0.29. They
# probe `feature = "cargo-clippy"` internally, and declaring the empty feature
# keeps rustc's `unexpected_cfgs` check quiet without enabling a build mode.
cargo-clippy = []
[dependencies]
# strand-quant — the absorbed codec backing TQ: owner of the wire format (STR2) + the
# integer-deterministic Q12 decode. Optional + behind the `tq` feature.
strand-quant = { path = "../../workspace/vendor/strand-quant", optional = true }
hawking-speculate = { path = "../hawking-speculate" }
thiserror = { workspace = true }
serde = { workspace = true }
# Complete-binary receipts are sealed by CPython over parsed binary64 values.
# `float_roundtrip` prevents the fast serde_json parser from changing a valid
# decimal by one ULP before strict seal verification.
serde_json = { workspace = true, features = ["float_roundtrip"] }
memmap2 = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
tokenizers = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
sha2 = { workspace = true, features = ["asm"] }
parking_lot = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

# BEGIN HAWKING TEST TOPOLOGY — generated targets keep routine source checks
# compact while preserving every historical test file as an explicit, isolated
# target when selected with `cargo test --test <name>`.

