[package]
name = "hide-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless HIDE agent kernel scaffold"
autotests = false

[dependencies]
walkdir = { workspace = true }
rand = { workspace = true }
aes-gcm = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
similar = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true, optional = true }
hide-core = { path = "../hide-core" }
hawking-context = { path = "../hawking-context" }
hawking-index = { path = "../hawking-index" }
hawking-orch = { path = "../hawking-orch" }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
axum = { workspace = true }

[features]
default = []
os-keychain = ["dep:keyring", "keyring/apple-native"]

# BEGIN HAWKING TEST TOPOLOGY — generated targets keep routine source checks
# compact while preserving every historical test file as an explicit, isolated
# target when selected with `cargo test --test <name>`.

[[test]]
name = "compile_all"
path = "tests/compile_all.rs"
test = false

[[test]]
name = "extension_registry_registry"
path = "tests/extension_registry_registry.rs"
test = false

[[test]]
name = "full_run"
path = "tests/full_run.rs"
test = false

[[test]]
name = "program_runtime_program"
path = "tests/program_runtime_program.rs"
test = false

[[test]]
name = "verify_plane_verify"
path = "tests/verify_plane_verify.rs"
test = false
