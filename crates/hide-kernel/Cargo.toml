[dependencies]
walkdir = { workspace = true }
rand = { workspace = true }
aes-gcm = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
similar = { workspace = true }
anyhow = { workspace = true }
