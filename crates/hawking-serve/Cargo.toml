[package]
name = "hawking-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenAI-compatible HTTP server for hawking-core"
autotests = false

[features]
# Forward the runtime `tq` feature down to hawking-core so a `hawking serve`
# built with `--features tq` can serve a `.tq` sidecar (HAWKING_QWEN_TQ). OFF by
# default: the default product build stays byte-identical (no strand-quant dep,
# no metal 0.27) and the existing gates stay green.
tq = ["hawking-core/tq"]

[dependencies]
hawking-core = { path = "../hawking-core" }
# Bridge-only: sole surface authority lives in hawking-adapters. default-features=false
# keeps HIDE/event mass out of the product serve binary (events feature is optional).
hawking-adapters = { path = "../hawking-adapters", version = "0.2.2", default-features = false }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# All three are already in the workspace lockfile via axum's tree, so this
# exposes them to the integration test without pulling new crates.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"

# BEGIN HAWKING TEST TOPOLOGY — generated targets keep routine source checks
# compact while preserving every historical test file as an explicit, isolated
# target when selected with `cargo test --test <name>`.

[[test]]
name = "compile_all"
path = "tests/compile_all.rs"
test = false

[[test]]
name = "effective_policy"
path = "tests/effective_policy.rs"
test = false

[[test]]
name = "energy_gather_window"
path = "tests/energy_gather_window.rs"
test = false

[[test]]
name = "greedy_lane_routing"
path = "tests/greedy_lane_routing.rs"
test = false

[[test]]
name = "hawking_native_endpoint"
path = "tests/hawking_native_endpoint.rs"
test = false

[[test]]
name = "http_integration"
path = "tests/http_integration.rs"
test = false

[[test]]
name = "system_kv_bank"
path = "tests/system_kv_bank.rs"
test = false

[[test]]
name = "system_kv_bank_wiring"
path = "tests/system_kv_bank_wiring.rs"
test = false

[[test]]
name = "workload_pack_mapping"
path = "tests/workload_pack_mapping.rs"
test = false
