[package]
name = "hawking-index-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "JSON query surface over hawking-index (python-facts dump for the auditor and reachability scan)"

[[bin]]
name = "hawking-index-query"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Same grammar crate + version hawking-index's GrammarRegistry::bundle(Python)
# compiles in (crates/hawking-index/Cargo.toml). The library crate is not
# writable in this lane and pulling it also pulls rustls (sandbox-blocked);
# this binary is the JSON surface r1/r2 share.
tree-sitter = "0.25"
tree-sitter-python = "0.23"
