[package]
name = "hide-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Agent Client Protocol (ACP) server boundary so HIDE appears as an agent inside ACP-speaking editors (Bible sec 10, sec 69). Wire shapes are spec-derived from the public Apache-2.0 ACP spec; model-free."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Projected FROM: the ONE HIDE schema authority. hide-acp maps its Items and
# Notifications onto ACP session updates and maps an ACP prompt back into a
# HIDE turn intent.
hide-protocol = { path = "../hide-protocol" }
# Optional live host binding: TurnHandler / SessionBinder that reach
# BackendHost via the existing handle_intent path (SubmitTurn). Default builds
# stay model-free and free of the host dep; the bin enables `backend`.
hide-backend = { path = "../hide-backend", optional = true }
hide-core = { path = "../hide-core", optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
# Wire AcpServer to BackendHost (W6). Pulls hide-backend + a tokio handle for
# the sync TurnHandler trait bridging async handle_intent.
backend = ["dep:hide-backend", "dep:hide-core", "dep:tokio"]

[[bin]]
name = "hide-acp-server"
path = "src/bin/hide-acp-server.rs"
required-features = ["backend"]