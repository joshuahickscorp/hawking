name: CI

on:
  push:
    branches: [main, "harden/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners expose a Metal device that then aborts at buffer allocation
  # (IOGPUMetalResource "resource != nil"), which SIGABRTs the whole test binary
  # and takes every unrelated test with it. Declaring the GPU unusable makes
  # MetalContext::new return Err before touching Metal, so GPU tests skip and
  # the rest still run. Unset everywhere else, so a real Mac still runs them.
  HAWKING_NO_GPU: "1"

jobs:
  # The Metal/inference stack. hawking-core is by far the heaviest crate in the
  # workspace and nothing outside these three packages depends on it, so it is
  # confined to this job -- see the `hide` job for the other half.
  core:
    name: fmt · clippy · build · test (core)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Registry only. The target dir is ~54 GB, which cannot fit GitHub's ~10 GB
      # per-repo cache budget, so caching it is not an option at this scale --
      # `cache-targets: false` stops us paying upload time for a save that would
      # be evicted or rejected. `cache-on-failure` matters more than it looks:
      # without it a red CI can never warm its own cache, so a repo that is
      # failing stays permanently cold, which is how this one has behaved.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
          shared-key: hawking-registry

      # No `--all`: it descends into the workspace-excluded vendor/ crates (the
      # absorbed STRAND quant track), which keep their upstream formatting. Plain
      # `cargo fmt` checks the workspace members only.
      - name: Format check
        run: cargo fmt -- --check

      # Deny the clippy groups that catch real defects (correctness, suspicious)
      # plus rustc warnings. The style / complexity / perf groups are advisory:
      # the workspace carries pre-existing nits there that are cosmetic, not
      # bugs. This keeps the meaningful gate strict without an open-ended
      # cosmetic-lint cleanup.
      - name: Clippy
        run: |
          cargo clippy -p hawking -p hawking-core -p hawking-serve -- \
            -D warnings \
            -A unexpected_cfgs \
            -A unused_assignments \
            -A clippy::style \
            -A clippy::complexity \
            -A clippy::perf

      # Kept despite the test-compile below: `cargo test` does not produce a
      # package's real (non-test) binary artifact, so dropping this would stop
      # checking that the shipped binaries link at all.
      - name: Build
        run: cargo build -p hawking -p hawking-core -p hawking-serve

      # Compile every test target, including the GPU/model parity gates, so a
      # broken test cannot hide behind a skip.
      - name: Compile all tests
        run: cargo test -p hawking -p hawking-core -p hawking-serve --no-run

      - name: Unit tests
        run: cargo test -p hawking -p hawking-core -p hawking-serve --lib --bins

  # Everything that does NOT pull in hawking-core: the HIDE product crates and
  # the small hawking crates they depend on. Previously this job ran
  # `--workspace`, which recompiled hawking-core a second time and made this the
  # critical path at 357s of test compilation for a crate it never needed.
  hide:
    name: clippy · build · test (hide)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Was missing entirely: this job used whatever toolchain the runner image
      # happened to ship while `core` pinned stable, so the two jobs could
      # disagree about what compiles.
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
          shared-key: hawking-registry

      # Was `-p hide-backend -p hide-fleet` only, so hide-core, hide-kernel and
      # hide-protocol were compiled but never linted. They are linted now.
      - name: Clippy
        run: |
          cargo clippy \
            -p hide-core -p hide-backend -p hide-kernel -p hide-fleet -p hide-protocol \
            -p hawking-context -p hawking-index -p hawking-orch \
            -p hawking-research -p hawking-events -p hawking-speculate \
            -p hawking-adapters -- \
            -D warnings \
            -A unexpected_cfgs \
            -A unused_assignments \
            -A clippy::style \
            -A clippy::complexity \
            -A clippy::perf

      - name: Build
        run: |
          cargo build \
            -p hide-core -p hide-backend -p hide-kernel -p hide-fleet -p hide-protocol \
            -p hawking-context -p hawking-index -p hawking-orch \
            -p hawking-research -p hawking-events -p hawking-speculate \
            -p hawking-adapters

      - name: Compile all tests
        run: |
          cargo test \
            -p hide-core -p hide-backend -p hide-kernel -p hide-fleet -p hide-protocol \
            -p hawking-context -p hawking-index -p hawking-orch \
            -p hawking-research -p hawking-events -p hawking-speculate \
            -p hawking-adapters --no-run

      - name: Unit tests
        run: |
          cargo test \
            -p hide-core -p hide-backend -p hide-kernel -p hide-fleet -p hide-protocol \
            -p hawking-context -p hawking-index -p hawking-orch \
            -p hawking-research -p hawking-events -p hawking-speculate \
            -p hawking-adapters --lib --bins

  # The bake tools are small, have no GPU surface, and were previously only
  # reached via `--workspace` in the job above. Their own job keeps them off
  # both critical paths.
  bake:
    name: clippy · test (bake tools)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
          shared-key: hawking-registry

      - name: Clippy
        run: |
          cargo clippy -p q4k_fast_tool -p awq_bake_tool -p tq_bake_tool -- \
            -D warnings \
            -A unexpected_cfgs \
            -A unused_assignments \
            -A clippy::style \
            -A clippy::complexity \
            -A clippy::perf

      - name: Compile all tests
        run: cargo test -p q4k_fast_tool -p awq_bake_tool -p tq_bake_tool --no-run

      - name: Unit tests
        run: cargo test -p q4k_fast_tool -p awq_bake_tool -p tq_bake_tool --bins
